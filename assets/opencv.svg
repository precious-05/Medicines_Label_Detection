<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 64" width="160" height="64" role="img" aria-labelledby="opencvTitle">
  <title id="opencvTitle">OpenCV</title>
  <rect width="160" height="64" rx="8" fill="none"/>
  <!-- three overlapping rings in OpenCV colors -->
  <g transform="translate(20,32)">
    <circle cx="0" cy="0" r="14" fill="#E53935" opacity="1" />
    <circle cx="22" cy="0" r="14" fill="#4CAF50" opacity="0.95" />
    <circle cx="44" cy="0" r="14" fill="#2196F3" opacity="0.95" />
  </g>
  <text x="86" y="42" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111">OpenCV</text>
</svg>
