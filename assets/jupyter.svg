<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="jupyterTitle">
  <title id="jupyterTitle">Jupyter logo</title>
  <defs>
    <linearGradient id="jupOrange" x1="0" x2="1">
      <stop offset="0" stop-color="#F37626"/>
